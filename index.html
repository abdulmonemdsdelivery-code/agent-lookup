<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تم تغيير الرابط</title>
    <link rel="icon" href="image/unnamed.jpg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #f4f6fb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #222;
      }
      .card {
        background: #fff;
        max-width: 480px;
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        padding: 32px 24px;
        text-align: center;
      }
      .card img { max-width: 180px; margin-bottom: 20px; }
      h1 { font-size: 24px; margin-bottom: 16px; color: #d32f2f; }
      p { font-size: 18px; line-height: 1.8; margin-bottom: 20px; }
      a.link {
        color: #1565c0;
        font-weight: bold;
        text-decoration: underline;
      }
      .btn {
        display: inline-block;
        background: #1565c0;
        color: #fff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 10px;
        font-size: 17px;
        margin-bottom: 24px;
      }
      .notes {
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 12px;
        padding: 16px;
        text-align: right;
        font-size: 16px;
        line-height: 2;
      }
      .notes strong { display: block; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="image/unnamed-removebg-preview.png" alt="" />

      <h1>⚠️ تم تغيير الرابط</h1>

      <p>
        للاستعلام على ملفك الشخصي برجاء زيارة
        <a class="link" href="https://my-rider.app" target="_blank">نظام مندوبي</a>
      </p>

      <a class="btn" href="https://my-rider.app" target="_blank">الدخول إلى نظام مندوبي</a>

      <div class="notes">
        <strong>📌 لا تنسَ:</strong>
        🔐 إنشاء كلمة سر خاصة بك<br />
        🔔 تفعيل الإشعارات عشان توصلك كل التحديثات
      </div>
    </div>
  </body>
</html>
